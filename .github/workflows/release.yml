name: Release

# Publishes a GitHub Release with ready-to-run downloads whenever a version tag is pushed:
#   1. set `version` in studio/Cargo.toml (e.g. 0.2.0) and commit it
#   2. git tag v0.2.0 && git push origin v0.2.0
# The tag must match the Cargo.toml version, or the release stops before building anything.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          cargo_version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' studio/Cargo.toml | head -1)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$cargo_version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match studio/Cargo.toml version $cargo_version"
            exit 1
          fi
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows package
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Studio has no `ring` dependency, so the GNU toolchain + MinGW-w64 is enough (see CLAUDE.md).
      - name: Install MinGW-w64
        run: choco install mingw -y

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      # The Windows package bundles FFmpeg (vendor\ is git-ignored, so fetch it here): the newest
      # release-branch win64 GPL build from BtbN, the same source the README points to.
      - name: Download FFmpeg
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "release-workflow" }
          $release = Invoke-RestMethod -Headers $headers "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest"
          $asset = $release.assets |
            Where-Object { $_.name -match '^ffmpeg-n(\d+)\.(\d+)-latest-win64-gpl-[\d.]+\.zip$' } |
            Sort-Object { [int]($_.name -replace '^ffmpeg-n(\d+)\..*', '$1') }, { [int]($_.name -replace '^ffmpeg-n\d+\.(\d+)-.*', '$1') } |
            Select-Object -Last 1
          if (-not $asset) { throw "No win64 GPL FFmpeg build found in BtbN's latest release" }
          Write-Output "Using $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extract
          $dir = Get-ChildItem ffmpeg-extract -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force vendor\ffmpeg | Out-Null
          Copy-Item "$($dir.FullName)\bin\ffmpeg.exe", "$($dir.FullName)\bin\ffprobe.exe", "$($dir.FullName)\LICENSE.txt" vendor\ffmpeg\

      - name: Package
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\package-studio.ps1 -Zip
          if ($LASTEXITCODE -ne 0) { throw "Packaging failed" }
          Move-Item dist\AI-Video-Studio-windows-x64.zip "dist\AI-Video-Studio-v${{ needs.version.outputs.version }}-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  linux:
    name: Linux package
    needs: version
    # Built on the oldest supported Ubuntu so the binary's glibc requirement is low enough for
    # most current distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Package
        run: |
          bash scripts/package-studio.sh
          mv dist/ai-video-studio-linux-x86_64.tar.gz \
             "dist/AI-Video-Studio-v${{ needs.version.outputs.version }}-linux-x86_64.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz

  publish:
    name: Publish release
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: AI Video Studio v${{ needs.version.outputs.version }}
          # Lists the commits/PRs since the previous tag; edit the text on GitHub afterwards if you like.
          generate_release_notes: true
          # Tags like v0.3.0-beta.1 become pre-releases, so "Latest" always points at a stable one.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: packages/*
